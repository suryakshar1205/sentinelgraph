# SentinelGraph Configuration
# Razorpay Buildathon 2026 — Track 02: AI Risk Manager

project:
  name: "SentinelGraph"
  version: "1.0.0"
  seed: 20260827
  timezone: "Asia/Kolkata"

data:
  total_transactions: 100000
  start_date: "2026-08-01T00:00:00"
  duration_days: 14
  num_merchants: 50
  num_customers: 15000
  num_devices: 12000
  num_ips: 10000
  num_payment_instruments: 14000
  split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15

features:
  velocity_windows_minutes: [10, 60, 360, 1440]
  amount_percentiles: [50, 90, 99]
  history_lookback_days: 7

models:
  baseline:
    algorithm: "hist_gradient_boosting" # or xgboost
    learning_rate: 0.08
    max_iter: 150
    max_depth: 6
    class_weight: "balanced"
    random_state: 20260827

graph:
  component_min_size: 2
  suspicious_account_per_device_thresh: 3
  suspicious_account_per_ip_thresh: 4
  suspicious_account_per_card_thresh: 2
  community_algorithm: "connected_components"

temporal:
  short_window_seconds: 1800   # 30 mins
  baseline_window_seconds: 21600 # 6 hours
  growth_acceleration_factor: 1.5

fusion:
  weights:
    behavioral: 0.30
    graph: 0.45
    temporal: 0.25
  thresholds:
    low: 25.0
    medium: 50.0
    high: 75.0
    critical: 90.0

business_cost:
  cost_fp: 150.0   # Operational & friction cost in INR per false positive review/hold
  cost_fn: 2500.0  # Loss cost in INR per missed fraud transaction
  exposure_multiplier: 1.25 # Projected multiplier for emerging ring propagation

llm:
  provider: "deterministic" # or "google" / "openai"
  model: "gemini-2.5-flash"
  temperature: 0.1
